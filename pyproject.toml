[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inf-pd-connectome"
version = "0.1.0"
description = "Connectome-guided motor phenotype learning for Parkinsonian assessment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["Parkinson's disease", "structural connectome", "graph transformer", "motor subdomains"]
dependencies = [
    "numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4", "tqdm>=4.65,<5", "torch>=2.1,<3"
]

[tool.setuptools]
py-modules = ["model_connectome", "train_stage1", "train_stage2_diagnosis", "train_stage2_hy", "train_stage2_total"]

[tool.pytest.ini_options]
testpaths = ["tests"]
